services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-}
    container_name: crypto-wallet-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-8001}:8001"
    volumes:
      - wallet-data:/data
    environment:
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY:-}
      - SESSION_SECRET=${SESSION_SECRET:-}

volumes:
  wallet-data:
